name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so the CLI is tested against new pixi and Create releases even
  # while it is unchanged.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # The two platforms Create supports: linux-64 and osx-arm64.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
      # Linting does not depend on the platform, so once is enough; and
      # shellcheck 0.11.0 on osx-arm64 reports SC2218 ("only defined later")
      # for functions defined at the top of bin/create, which Linux's does not.
      - run: pixi run lint
        if: runner.os == 'Linux'
      - run: pixi run test
      - run: pixi run e2e
      - run: pixi run package
