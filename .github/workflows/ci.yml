name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so the main.mojo template is built against new create releases
  # even while the CLI is unchanged.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # The two platforms Create supports: linux-64 and osx-arm64.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
      # Linting does not depend on the platform, so once is enough; and
      # shellcheck 0.11.0 on osx-arm64 reports SC2218 ("only defined later")
      # for functions defined at the top of bin/create, which Linux's does not.
      - run: pixi run lint
        if: runner.os == 'Linux'
      - run: pixi run test
      - run: pixi run e2e
      - run: pixi run package

  # New projects get the Create releases bin/create pins (CREATE_SPEC); this
  # builds the template against the newest one, so a breaking Create release
  # shows up here before the pin is moved past it.
  latest-create:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
      - run: pixi run e2e-latest
