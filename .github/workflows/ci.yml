name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so the main.mojo template is built against new create releases
  # even while the CLI is unchanged.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
      - run: pixi run lint
      - run: pixi run test
      - run: pixi run e2e
      - run: pixi run package
