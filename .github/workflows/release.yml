name: Release

# Builds the package and uploads it to the prefix.dev channel through trusted
# publishing: the channel must trust this repository and workflow.
on:
  push:
    tags: ["v*"]

env:
  CHANNEL: create-framework/create

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
      - name: Check the tag matches the version
        run: test "$(bin/create --version)" = "create ${GITHUB_REF_NAME#v}"
      - run: pixi run package
      - run: pixi run rattler-build upload prefix --channel "$CHANNEL" build/noarch/*.conda
