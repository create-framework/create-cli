# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
#
# Built by `pixi run package`, and published by the release workflow, which
# sets CREATE_CLI_VERSION from the release's tag. The build writes the version
# into bin/create, so the tag is the one place it is set.
context:
  version: ${{ env.get("CREATE_CLI_VERSION", default="0.0.0.dev0") }}

package:
  name: create-cli
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  noarch: generic
  script:
    - mkdir -p "$PREFIX/bin"
    - sed 's/^VERSION=.*/VERSION="${{ version }}"/' bin/create >"$PREFIX/bin/create"
    - chmod 755 "$PREFIX/bin/create"

# No dependency on pixi: the CLI is installed with it, and uses the one on
# PATH.

tests:
  - script:
      - test "$(create --version)" = "create-cli ${{ version }}"
      - create --help
      - create new --help

about:
  homepage: https://github.com/create-framework/create-cli
  repository: https://github.com/create-framework/create-cli
  license: MIT
  license_file: LICENSE
  summary: Start and run projects for Create, the creative coding library for Mojo
