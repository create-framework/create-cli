[workspace]
name = "create-cli"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tasks]
lint = "shellcheck bin/create tests/unit.sh tests/e2e.sh"
test = "sh tests/unit.sh"
e2e = "sh tests/e2e.sh"
package = "rattler-build build --recipe recipe/recipe.yaml --output-dir build"

[dependencies]
shellcheck = ">=0.10,<0.12"
rattler-build = ">=0.30,<1"
